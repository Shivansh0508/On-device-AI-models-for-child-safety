<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Classifier</title>
    <meta name="description" content="A simple, fast, and beautiful AI text classifier.">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="icon-container">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#paint0_linear)" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="url(#paint1_linear)" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="url(#paint2_linear)" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="paint0_linear" x1="2" y1="7" x2="22" y2="7" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#8B5CF6" />
                            <stop offset="1" stop-color="#3B82F6" />
                        </linearGradient>
                        <linearGradient id="paint1_linear" x1="2" y1="19.5" x2="22" y2="19.5"
                            gradientUnits="userSpaceOnUse">
                            <stop stop-color="#8B5CF6" />
                            <stop offset="1" stop-color="#3B82F6" />
                        </linearGradient>
                        <linearGradient id="paint2_linear" x1="2" y1="14.5" x2="22" y2="14.5"
                            gradientUnits="userSpaceOnUse">
                            <stop stop-color="#8B5CF6" />
                            <stop offset="1" stop-color="#3B82F6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Text Classifier</h1>
            <p>Enter any text below to predict its category using our AI model.</p>
        </header>

        <main class="main-content">
            <form id="classifier-form" class="classifier-form">
                <div class="input-group">
                    <label for="text-input" class="sr-only">Text to classify</label>
                    <textarea id="text-input" placeholder="Type or paste your text here..." rows="5"
                        required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="btn-text">Classify Text</span>
                    <div class="loader" id="btn-loader"></div>
                </button>
            </form>

            <div id="result-container" class="result-container hidden">
                <h3 class="result-label">Result</h3>
                <div id="result-box" class="result-box">
                    <span id="result-text">Category</span>
                </div>
            </div>

            <div id="error-container" class="error-container hidden">
                <div class="error-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="error-text">An error occurred.</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
